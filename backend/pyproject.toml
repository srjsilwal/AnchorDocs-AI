[project]
name = "backend"
version = "0.1.0"
description = "AnchorDocs document safety and AI gateway service"
readme = "README.md"
authors = [
    { name = "srjsilwal", email = "s6007118@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.163.0",
    "google-generativeai>=0.8.6",
    "langchain>=1.5.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.0",
    "langchain-google-genai>=4.5.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "langfuse>=5.2.0",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-postgres>=3.2.1",
    "litellm>=1.109.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "sentence-transformers>=6.3.0",
    "supabase>=2.34.1",
    "upstash-ratelimit>=1.2.0",
    "upstash-redis>=1.9.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
